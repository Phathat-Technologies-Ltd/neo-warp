[package]
name = "local_transcription"
version = "0.1.0"
edition = "2024"
publish.workspace = true
license.workspace = true

[features]
# Runs NVIDIA Parakeet TDT 0.6B v3 through ONNX Runtime. Off by default so crates that only need
# the trait and the model store don't build ONNX Runtime.
parakeet = ["dep:parakeet-rs", "dep:realfft"]
# Runs Silero VAD v5 on the same ONNX Runtime.
silero = ["dep:parakeet-rs"]
# Speaks with Kokoro-82M v1.0 on the same ONNX Runtime.
kokoro = ["dep:parakeet-rs"]
# Speaks with Kyutai Pocket TTS on the same ONNX Runtime.
pocket = ["dep:parakeet-rs"]
# Speaks with tiny-voca on the same ONNX Runtime.
tiny_voca = ["dep:parakeet-rs"]
# Embeds speakers' voices with CAM++ on the same ONNX Runtime.
speaker_id = ["dep:parakeet-rs"]
# Detects the end of a speaker's turn with Smart Turn v3 on the same ONNX Runtime.
smart_turn = ["dep:parakeet-rs"]
# Speaks with the macOS system voices through AVSpeechSynthesizer (no download; macOS only).
apple = ["dep:block2", "dep:objc2", "dep:objc2-avf-audio", "dep:objc2-foundation"]
# Suppresses background noise with RNNoise (pure Rust).
denoise = ["dep:nnnoiseless"]

[dependencies]
futures.workspace = true
hex.workspace = true
hound = "3.5.1"
instant.workspace = true
log.workspace = true
nnnoiseless = { version = "0.5.2", default-features = false, optional = true }
parakeet-rs = { version = "0.4.4", default-features = false, features = ["cpu", "ort-defaults", "api-28"], optional = true }
realfft = { version = "3", optional = true }
rustfft = "6.2.0"
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "io-util"] }

[target.'cfg(target_os = "macos")'.dependencies]
block2 = { version = "0.6", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-avf-audio = { version = "0.3.2", default-features = false, features = ["std", "block2", "AVAudioBuffer", "AVAudioFormat", "AVAudioTypes", "AVSpeechSynthesis"], optional = true }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDate", "NSObjCRuntime", "NSRunLoop", "NSString"], optional = true }

[dev-dependencies]
axum.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread"] }

[[example]]
name = "bias_eval"
required-features = ["parakeet"]

[[example]]
name = "eot_eval"
required-features = ["kokoro", "silero", "smart_turn"]

[[example]]
name = "tts_bench"
required-features = ["kokoro", "pocket", "tiny_voca"]
