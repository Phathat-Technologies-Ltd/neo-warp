[package]
name = "voice_input"
edition = "2024"
authors.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
warp_errors.workspace = true
anyhow = { workspace = true }
async-channel = { workspace = true }
futures = { workspace = true }
thiserror = { workspace = true }
base64 = { workspace = true }
cpal = "0.18.2"
hound = "3.5.1"
instant = { workspace = true }
log = { workspace = true }
parking_lot = { workspace = true }
rubato = "0.16.1"
warpui_core.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
coreaudio-rs = { version = "0.14.2", default-features = false, features = ["core_audio", "audio_toolbox"], optional = true }
objc2-audio-toolbox = { version = "0.3", default-features = false, features = ["std", "AUComponent", "AudioUnitProperties"], optional = true }
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware"], optional = true }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std"], optional = true }

# Used by the `system_aec_probe` spike only.
[target.'cfg(target_os = "macos")'.dev-dependencies]
objc2 = "0.6"
objc2-core-audio = { version = "0.3", default-features = false, features = ["std", "AudioHardware", "objc2", "objc2-foundation"] }
objc2-core-audio-types = { version = "0.3", default-features = false, features = ["std"] }
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFDictionary", "CFString"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSUUID", "NSValue", "NSObject"] }
sonora = "0.3"

[features]
# Echo-cancelled full-duplex audio through Apple's voice-processing I/O unit (macOS only).
voice_processing = [
    "dep:coreaudio-rs",
    "dep:objc2-audio-toolbox",
    "dep:objc2-core-audio",
    "dep:objc2-core-audio-types",
]
